[project]
name = "causal-uplift"
version = "0.1.0"
description = "Causal inference for product experiments: CUPED variance reduction + uplift modeling (T/S-learner) with heterogeneous treatment effects."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
